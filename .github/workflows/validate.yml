name: Validate E2EESA

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4.3.0

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"

      - name: Validate repository invariants
        run: python scripts/validate_repo.py

      - name: Validate 0.9 candidate freeze
        run: python scripts/release_candidate.py

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Verify independent canonical byte implementation
        run: |
          node --version
          python -m unittest discover -s tests -p test_cross_language_bytes.py -v

      - name: Seeded adversarial reference checks
        run: python scripts/run_reference_security_checks.py --seed 20261007 --iterations 1000

name: Temporary public-portal repair verification
on:
  push:
    branches:
      - fix/website-loading-navigation-content-20261010
  workflow_dispatch:
jobs:
  build-and-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate all specifications and test startup/navigation
        run: node website/build.mjs && node website/check.mjs

name: Probe live standards site
on:
  push:
    branches:
      - ops/verify-live-website-20261010
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-public:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Check public deployment and clickable documentation paths
        run: |
          node --input-type=module <<'NODE'
          import assert from 'node:assert/strict';
          import vm from 'node:vm';
          const base = 'https://end-to-end-everywhere-standard.onrender.com';
          const checks = [
            {path:'/',type:'text/html',test:s=>s.includes('app.js?v=20261010-repair')},
            {path:'/?view=profiles',type:'text/html',test:s=>s.includes('id="app"')},
            {path:'/app.js?v=20261010-repair',type:'javascript',test:s=>{try{new vm.Script(s);return s.includes('There is a place for you here.')}catch{return false}}},
            {path:'/styles.css',type:'text/css',test:s=>s.includes('.sidebar-nav')},
            {path:'/data/standard.json',type:'json',test:s=>{try{let d=JSON.parse(s);return d.specifications.length>=50&&d.specifications.some(x=>x.url==='standards/README.html')}catch{return false}}},
            {path:'/standards/README.html',type:'text/html',test:s=>s.includes('reader-article')&&s.includes('Normative')&&s.includes('normative-language.html')},
            {path:'/standards/profile-configuration.html',type:'text/html',test:s=>s.includes('reader-article')&&s.includes('Profile and Configuration Model')}
          ];
          for(let attempt=1; attempt<=24;attempt++){
            const outputs = await Promise.all(checks.map(async c=>{
              try{
                const response=await fetch(base+c.path,{signal:AbortSignal.timeout(15000),headers:{'Cache-Control':'no-cache'}});
                const body=await response.text();
                return {path:c.path,status:response.status,ok:response.ok&&c.test(body),bytes:body.length};
              }catch(e){return {path:c.path,status:'ERROR',ok:false,error:String(e).slice(0,160)}}
            }));
            if(outputs.every(x=>x.ok)){
              console.log('LIVE SITE VERIFIED:');
              for(const x of outputs)console.log(JSON.stringify(x));
              process.exit(0);
            }
            console.log('Attempt '+attempt+': '+outputs.filter(x=>!x.ok).map(x=>x.path+'='+x.status).join(', '));
            if(attempt===24){
              console.error('Live-site verification failed:',JSON.stringify(outputs));
              process.exit(1);
            }
            await new Promise(resolve=>setTimeout(resolve,10000));
          }
          NODE

  browser:
    needs: verify-public
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Install browser and test library
        run: |
          npm install --no-save --package-lock=false playwright@1.56.1
          npx playwright install chromium
      - name: Verify real desktop and mobile navigation on public website
        run: node website/browser-live-smoke.mjs

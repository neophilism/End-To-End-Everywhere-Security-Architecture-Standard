# Temporary internal-PR repair builder; remove before final CI and merge.
name: Prepare reviewed invalidation repair
on:
  pull_request:
permissions:
  contents: read
jobs:
  reviewed-repair:
    if: >-
      github.repository == 'neophilism/End-To-End-Everywhere-Security-Architecture-Standard' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/aud-09-persist-invalidation'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Reproduce, repair, test, and store reviewed blobs without updating refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          import subprocess
          import sys
          import urllib.request

          root = Path.cwd()
          sys.path.insert(0, str(root / 'scripts'))
          import release_candidate

          engine_path = root / 'scripts/key_verification_engine.py'
          spec_path = root / 'spec/key-verification.md'
          assert release_candidate.git_blob_sha(engine_path.read_bytes()) == '56e7c88e2b0ef96b726caef603d2960319d49950'
          assert release_candidate.git_blob_sha(spec_path.read_bytes()) == 'd1134beeb179f30662ce238e6b02f9aceb1d4860'
          command = [sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_key_verification_invalidation.py', '-v']
          baseline = subprocess.run(command, capture_output=True, text=True, timeout=60)
          print('BASELINE OUTPUT\n' + baseline.stdout + baseline.stderr)
          assert baseline.returncode == 1 and 'FAILED (failures=4)' in baseline.stderr, 'Expected four invalidation regression failures and no infrastructure errors'

          original = '    return {\n        "status": "verified",\n        "requires_manual_reverification": False,\n        "errors": [],\n    }\n'
          replacement = (
              '    # A previous comparison stays invalidated even if its subject returns.\n'
              '    if record["status"] == "invalidated":\n'
              '        return {\n'
              '            "status": "invalidated",\n'
              '            "requires_manual_reverification": True,\n'
              '            "errors": [],\n'
              '        }\n'
              + original
          )
          engine = engine_path.read_text(encoding='utf-8')
          assert engine.count(original) == 1
          engine_path.write_text(engine.replace(original, replacement), encoding='utf-8')

          old = 'A product **MUST NOT** silently copy verification status from an obsolete subject to a new subject.\n'
          new = old + (
              '\nA manual record already marked `invalidated` **MUST NOT** become `verified`\n'
              'merely because an earlier subject digest matches the current snapshot again.\n'
              'Restoring verified trust **MUST** create a new record from a fresh explicit\n'
              'out-of-band comparison; editing the old status field is not re-verification.\n'
              '\nThe relying endpoint **MUST** durably and atomically persist an accepted\n'
              'invalidation before relying on verification for send or display decisions.\n'
              'The pure reference status evaluator does not perform that persistence.\n'
          )
          specification = spec_path.read_text(encoding='utf-8')
          assert specification.count(old) == 1
          spec_path.write_text(specification.replace(old, new), encoding='utf-8')

          completed = subprocess.run(
              [sys.executable, '-m', 'unittest', 'discover', '-s', 'tests', '-p', 'test_key_verification*.py', '-v'],
              capture_output=True, text=True, timeout=60,
          )
          print('REPAIRED OUTPUT\n' + completed.stdout + completed.stderr)
          assert completed.returncode == 0, 'Repaired key-verification tests must all pass'

          (root / '.github/workflows/invalidation-repair-bootstrap.yml').unlink()
          policy = release_candidate.load_json(root, 'registry/release-candidate.json')
          assert policy['development_state'] == 'audit-remediation'
          assert policy['manifest_path'] == 'release/0.9.0-rc.2-dev-manifest.json'
          stored = release_candidate.load_json(root, policy['manifest_path'])
          manifest = release_candidate.build_manifest(root, policy)
          before = {item['path']: item for item in stored['files']}
          after = {item['path']: item for item in manifest['files']}
          changed = {path for path in before.keys() | after.keys() if before.get(path) != after.get(path)}
          assert changed == {'scripts/key_verification_engine.py', 'spec/key-verification.md', 'tests/test_key_verification_invalidation.py'}, sorted(changed)
          assert manifest['file_count'] == stored['file_count'] + 1
          outputs = {
              'ENGINE_BLOB': engine_path.read_bytes(),
              'SPEC_BLOB': spec_path.read_bytes(),
              'MANIFEST_BLOB': (json.dumps(manifest, indent=2) + '\n').encode('utf-8'),
          }
          for label, data in outputs.items():
              request = urllib.request.Request(
                  'https://api.github.com/repos/neophilism/End-To-End-Everywhere-Security-Architecture-Standard/git/blobs',
                  data=json.dumps({'content': data.decode('utf-8'), 'encoding': 'utf-8'}).encode('utf-8'),
                  headers={
                      'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                      'Accept': 'application/vnd.github+json',
                      'Content-Type': 'application/json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  }, method='POST',
              )
              with urllib.request.urlopen(request, timeout=30) as response:
                  blob = json.load(response)
              assert blob['sha'] == release_candidate.git_blob_sha(data)
              print(label + '=' + blob['sha'])
          print('FILE_COUNT=' + str(manifest['file_count']))
          print('Only Git blobs were stored; no refs, PRs, tags, releases or merge gates were changed.')
          PY

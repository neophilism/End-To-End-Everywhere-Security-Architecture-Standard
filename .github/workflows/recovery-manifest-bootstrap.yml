# Temporary repair helper. Remove before merge; normal validation stays enabled.
name: Build reviewed recovery manifest blob
on:
  pull_request:
permissions:
  contents: read
jobs:
  development-manifest:
    if: >-
      github.repository == 'neophilism/End-To-End-Everywhere-Security-Architecture-Standard' &&
      github.event.pull_request.number == 62 &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.head_ref == 'agent/aud-08-identity-recovery'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Store manifest blob for the final tree without this helper
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          import sys
          import urllib.request

          root = Path.cwd()
          expected_changes = {
              'scripts/identity_recovery_engine.py': 'a23fd0de59d63f9104733ae3f1203f4580d6fd85',
              'schemas/identity-recovery-event.schema.json': '5c8751261cb77faf2976e2715f157f3f9daa413f',
              'fixtures/identity-recovery/valid-retained-authority-event.json': '822dd960ca639dfb3837f5872fec7488bf6eedc8',
              'fixtures/identity-recovery/valid-contact-replacement-event.json': 'fd1accf6a066c99031c984b9c7bba87e8de97fcf',
              'adr/0045-recovery-authority-does-not-imply-inherited-trust.md': 'e51b922fe54a40b18ad709ce4aad7116aa61982e',
              'tests/test_identity_recovery_engine.py': '68c07949d659b2f01aef28119c904243427f8e97',
              'tests/test_identity_recovery_malformed_inputs.py': '0e3d350f6b5f7d9151d1ea659d4b4264b6ff1254',
              'tests/test_identity_recovery_result_binding.py': '3e011ffa25949b10e9134d0a9781a6853b1bf3d0',
          }
          (root / '.github/workflows/recovery-manifest-bootstrap.yml').unlink()
          sys.path.insert(0, str(root / 'scripts'))
          import release_candidate

          policy = release_candidate.load_json(root, 'registry/release-candidate.json')
          assert policy['development_state'] == 'audit-remediation'
          assert policy['manifest_path'] == 'release/0.9.0-rc.2-dev-manifest.json'
          stored = release_candidate.load_json(root, policy['manifest_path'])
          manifest = release_candidate.build_manifest(root, policy)
          before = {item['path']: item for item in stored['files']}
          after = {item['path']: item for item in manifest['files']}
          changed = {path for path in before.keys() | after.keys() if before.get(path) != after.get(path)}
          assert changed == set(expected_changes), sorted(changed)
          for path, sha in expected_changes.items():
              assert after[path]['git_blob_sha'] == sha, path
          assert manifest['file_count'] == stored['file_count'] + 2
          data = (json.dumps(manifest, indent=2) + '\n').encode('utf-8')
          expected_blob = release_candidate.git_blob_sha(data)
          request = urllib.request.Request(
              'https://api.github.com/repos/neophilism/End-To-End-Everywhere-Security-Architecture-Standard/git/blobs',
              data=json.dumps({'content': data.decode('utf-8'), 'encoding': 'utf-8'}).encode('utf-8'),
              headers={
                  'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
                  'Accept': 'application/vnd.github+json',
                  'Content-Type': 'application/json',
                  'X-GitHub-Api-Version': '2022-11-28',
              },
              method='POST',
          )
          with urllib.request.urlopen(request, timeout=30) as response:
              blob = json.load(response)
          assert blob['sha'] == expected_blob
          print('DEVELOPMENT_MANIFEST_BLOB=' + blob['sha'])
          print('FILE_COUNT=' + str(manifest['file_count']))
          print('No branch, tag, release, or pull request was modified by this job.')
          PY

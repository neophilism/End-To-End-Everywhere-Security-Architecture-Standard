name: Temporary hashed website validation
on:
  push:
    branches:
      - fix/website-content-hashed-assets-20261010
jobs:
  build-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - name: Generate and test twice including cache-safe filenames
        run: |
          node website/build.mjs
          node website/check.mjs
          node website/build.mjs
          node website/check.mjs
